<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Permissions-Policy" content="accelerometer=(), camera=(), microphone=(), geolocation=(), gyroscope=(), magnetometer=(), midi=(), payment=(), usb=(), xr-spatial-tracking=(), encrypted-media=(), clipboard-write=()">
  <title>Multi-Agent Projektový Orchestrátor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Temporary fallback to Tailwind CSS CDN to bypass local configuration issues -->
  <style>
    /* Dark Theme (Default) Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #1e293b; /* bg-slate-800 */
    }
    ::-webkit-scrollbar-thumb {
      background: #475569; /* bg-slate-600 */
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #64748b; /* bg-slate-500 */
    }

    /* Light Theme Styles */
    .light body, .light #root {
        background-color: #f1f5f9; /* bg-slate-100 */
        color: #1e293b; /* bg-slate-800 */
    }
    .light ::-webkit-scrollbar-track {
        background: #e2e8f0; /* bg-slate-200 */
    }
    .light ::-webkit-scrollbar-thumb {
        background: #94a3b8; /* bg-slate-400 */
    }
    .light ::-webkit-scrollbar-thumb:hover {
        background: #64748b; /* bg-slate-500 */
    }
    /* General background and text color overrides */
    .light .from-slate-900 { --tw-gradient-from: #f1f5f9; --tw-gradient-to: rgba(241, 245, 249, 0); }
    .light .via-slate-800 { --tw-gradient-stops: var(--tw-gradient-from), #e2e8f0, var(--tw-gradient-to); }
    .light .to-sky-900 { --tw-gradient-to: #e0f2fe; }
    .light .bg-slate-900 { background-color: #f8fafc; } /* Main BG: Slate-50 */
    .light .bg-slate-900\/80 { background-color: rgba(248, 250, 252, 0.8); }
    .light .bg-slate-900\/50 { background-color: rgba(248, 250, 252, 0.5); }
    .light .bg-slate-800 { background-color: #ffffff; } /* Card BG: White */
    .light .bg-slate-800\/50 { background-color: rgba(255, 255, 255, 0.5); }
    .light .bg-slate-800\/60 { background-color: rgba(255, 255, 255, 0.6); }
    .light .bg-slate-700 { background-color: #f1f5f9; } /* Inner Card BG: Slate-100 */
    .light .bg-slate-700\/70 { background-color: rgba(241, 245, 249, 0.7); }
    .light .bg-slate-700\/80 { background-color: rgba(241, 245, 249, 0.8); }
    .light .bg-slate-700\/50 { background-color: rgba(241, 245, 249, 0.5); }
    .light .bg-slate-600 { background-color: #e2e8f0; } /* Borders, inputs */
    .light .border-slate-700 { border-color: #e2e8f0; } /* Card borders: Slate-200 */
    .light .border-slate-600 { border-color: #cbd5e1; } /* Inner borders: Slate-300 */
    .light .text-slate-100 { color: #1e293b; } /* Headings: Slate-800 */
    .light .text-slate-200 { color: #334155; } /* Body Text: Slate-700 */
    .light .text-slate-300 { color: #475569; } /* Sub-text: Slate-600 */
    .light .text-slate-400 { color: #64748b; } /* Faint text: Slate-500 */
    
    /* Accent color overrides */
    .light .text-sky-300 { color: #0369a1; } /* sky-700 */
    .light .text-sky-400 { color: #0284c7; } /* sky-600 */
    .light .border-sky-500 { border-color: #0ea5e9; }
    .light .bg-sky-900\/50 { background-color: #e0f2fe; } /* sky-100 */
    .light .bg-sky-700 { background-color: #0369a1; }
    .light .bg-sky-600 { background-color: #0284c7; }
    .light .bg-teal-600 { background-color: #0d9488; }
    .light .bg-teal-700 { background-color: #0f766e; }
    .light .bg-purple-600 { background-color: #7e22ce; }
    .light .bg-indigo-600 { background-color: #4f46e5; }
    .light .bg-orange-600 { background-color: #ea580c; }
    .light .bg-red-700 { background-color: #fef2f2; border-color: #fecaca; color: #b91c1c; }
    .light .text-red-100 { color: #b91c1c; }
    .light .text-red-300 { color: #dc2626; }
    .light .border-red-900 { border-color: #fecaca; }

    /* Prose overrides for Markdown content */
    .light .prose-invert {
       --tw-prose-body: #334155; /* slate-700 */
       --tw-prose-headings: #1e293b; /* slate-800 */
       --tw-prose-lead: #475569; /* slate-600 */
       --tw-prose-links: #2563eb; /* blue-600 */
       --tw-prose-bold: #1e293b; /* slate-800 */
       --tw-prose-counters: #64748b; /* slate-500 */
       --tw-prose-bullets: #64748b; /* slate-500 */
       --tw-prose-hr: #e2e8f0; /* slate-200 */
       --tw-prose-quotes: #1e293b; /* slate-800 */
       --tw-prose-quote-borders: #cbd5e1; /* slate-300 */
       --tw-prose-captions: #64748b; /* slate-500 */
       --tw-prose-code: #1e293b; /* slate-800 */
       --tw-prose-pre-code: #e2e8f0; /* For syntax highlighter background */
       --tw-prose-pre-bg: #f8fafc;  /* For syntax highlighter background */
       --tw-prose-th-borders: #cbd5e1; /* slate-300 */
       --tw-prose-td-borders: #e2e8f0; /* slate-200 */
    }
    .light .prose-invert code:not([data-lang]) {
        background-color: #e2e8f0; /* bg-slate-200 */
        color: #c026d3; /* fuchsia-600 */
        padding: 0.125rem 0.25rem;
        border-radius: 0.25rem;
    }
    .light .prose-invert a { color: #2563eb; }
    .light .prose-invert a:hover { color: #1d4ed8; }

    /* Fixes for Light Theme Visibility */
    .light .settings-button {
      background-color: #e2e8f0; /* bg-slate-200 */
      color: #334155; /* text-slate-700 */
    }
    .light .settings-button:hover {
      background-color: #cbd5e1; /* bg-slate-300 */
    }
    .light .documentation-list-item[data-selected="false"]:hover {
       background-color: #f1f5f9; /* bg-slate-100 */
    }

    /* Simple loading animation */
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .animate-spin-slow {
      animation: spin 3s linear infinite;
    }

    @media print {
      body, html {
        background: white !important;
        color: black !important;
        height: auto !important;
        overflow: visible !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      @page {
        margin: 0.75in;
        size: A4;
      }
    }
  </style>
<script>
  // Dynamically determine base URL
  const getBaseUrl = () => {
    const pathArray = window.location.pathname.split('/');
    let basePath = window.location.origin;
    if (pathArray.length > 1) {
      basePath += pathArray.slice(0, -1).join('/') + '/';
    } else if (pathArray.length === 1 && pathArray[0] === "" && window.location.pathname.endsWith('/')) {
      basePath += '/';
    } else if (pathArray.length === 1 && pathArray[0] === "" && !window.location.pathname.endsWith('/')) {
       basePath += '/';
    } else {
      basePath += '/';
    }
    if (!basePath.endsWith('/')) {
        basePath += '/';
    }
    return basePath;
  };
  const base_url = getBaseUrl();

  // Dynamically create importmap - ONLY ONE importmap should exist
  const importmap = {
    imports: {
      "@/": base_url,
      "react": "https://esm.sh/react@^19.1.0",
      "react/": "https://esm.sh/react@^19.1.0/",
      "react-dom": "https://esm.sh/react-dom@^19.1.0",
      "react-dom/": "https://esm.sh/react-dom@^19.1.0/",
      "@heroicons/react/": "https://esm.sh/@heroicons/react@^2.2.0/",
      "@google/genai": "https://esm.sh/@google/genai@^1.7.0",
      "nanoid": "https://esm.sh/nanoid@^5.1.5", 
      "react-markdown": "https://esm.sh/react-markdown@^10.1.0",
      "remark-gfm": "https://esm.sh/remark-gfm@^4.0.1",
      "react-syntax-highlighter": "https://esm.sh/react-syntax-highlighter@15.5.0",
      "react-syntax-highlighter/": "https://esm.sh/react-syntax-highlighter@15.5.0/",
      "immer": "https://esm.sh/immer@10.1.1",
      "mermaid": "https://esm.sh/mermaid@11.7.0"
    }
  };
  const importmapScript = document.createElement('script');
  importmapScript.type = 'importmap';
  importmapScript.textContent = JSON.stringify(importmap, null, 2);
  // Ensure no other importmap script is present before appending
  const existingImportmaps = document.querySelectorAll('script[type="importmap"]');
  existingImportmaps.forEach(map => map.remove()); // Remove all existing importmaps
  document.head.appendChild(importmapScript); // Append the new consolidated one
</script>
<!-- Removed static importmap to avoid conflicts with dynamically generated one -->
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-slate-900 text-slate-100 antialiased">
  <div id="root"></div>
  <div id="modal-root"></div>
  <script>
    const mainScript = document.createElement('script');
    mainScript.type = 'module';
    mainScript.src = base_url + 'index.tsx';
    document.body.appendChild(mainScript);
  </script>
</body>
</html>
