<!DOCTYPE html>
<html lang="sk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Permissions-Policy"
      content="accelerometer=(), camera=(), microphone=(), geolocation=(), gyroscope=(), magnetometer=(), midi=(), payment=(), usb=(), xr-spatial-tracking=(), encrypted-media=(), clipboard-write=()"
    />
    <title>Multi-Agent Projektový Orchestrátor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: #1e293b; }
      ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #64748b; }

      .light body, .light #root { background-color: #f1f5f9; color: #1e293b; }
      .light ::-webkit-scrollbar-track { background: #e2e8f0; }
      .light ::-webkit-scrollbar-thumb { background: #94a3b8; }
      .light ::-webkit-scrollbar-thumb:hover { background: #64748b; }

      .light .from-slate-900 { --tw-gradient-from: #f1f5f9; --tw-gradient-to: rgba(241, 245, 249, 0); }
      .light .via-slate-800 { --tw-gradient-stops: var(--tw-gradient-from), #e2e8f0, var(--tw-gradient-to); }
      .light .to-sky-900 { --tw-gradient-to: #e0f2fe; }
      .light .bg-slate-900 { background-color: #f8fafc; }
      .light .bg-slate-900\/80 { background-color: rgba(248, 250, 252, 0.8); }
      .light .bg-slate-900\/50 { background-color: rgba(248, 250, 252, 0.5); }
      .light .bg-slate-800 { background-color: #ffffff; }
      .light .bg-slate-800\/50 { background-color: rgba(255, 255, 255, 0.5); }
      .light .bg-slate-800\/60 { background-color: rgba(255, 255, 255, 0.6); }
      .light .bg-slate-700 { background-color: #f1f5f9; }
      .light .bg-slate-700\/70 { background-color: rgba(241, 245, 249, 0.7); }
      .light .bg-slate-700\/80 { background-color: rgba(241, 245, 249, 0.8); }
      .light .bg-slate-700\/50 { background-color: rgba(241, 245, 249, 0.5); }
      .light .bg-slate-600 { background-color: #e2e8f0; }
      .light .border-slate-700 { border-color: #e2e8f0; }
      .light .border-slate-600 { border-color: #cbd5e1; }
      .light .text-slate-100 { color: #1e293b; }
      .light .text-slate-200 { color: #334155; }
      .light .text-slate-300 { color: #475569; }
      .light .text-slate-400 { color: #64748b; }
      .light .text-sky-300 { color: #0369a1; }
      .light .text-sky-400 { color: #0284c7; }
      .light .border-sky-500 { border-color: #0ea5e9; }
      .light .bg-sky-900\/50 { background-color: #e0f2fe; }
      .light .bg-sky-700 { background-color: #0369a1; }
      .light .bg-sky-600 { background-color: #0284c7; }
      .light .bg-teal-600 { background-color: #0d9488; }
      .light .bg-teal-700 { background-color: #0f766e; }
      .light .bg-purple-600 { background-color: #7e22ce; }
      .light .bg-indigo-600 { background-color: #4f46e5; }
      .light .bg-orange-600 { background-color: #ea580c; }
      .light .bg-red-700 { background-color: #fef2f2; border-color: #fecaca; color: #b91c1c; }
      .light .text-red-100 { color: #b91c1c; }
      .light .text-red-300 { color: #dc2626; }
      .light .border-red-900 { border-color: #fecaca; }
      .light .prose-invert {
        --tw-prose-body: #334155;
        --tw-prose-headings: #1e293b;
        --tw-prose-lead: #475569;
        --tw-prose-links: #2563eb;
        --tw-prose-bold: #1e293b;
        --tw-prose-counters: #64748b;
        --tw-prose-bullets: #64748b;
        --tw-prose-hr: #e2e8f0;
        --tw-prose-quotes: #1e293b;
        --tw-prose-quote-borders: #cbd5e1;
        --tw-prose-captions: #64748b;
        --tw-prose-code: #1e293b;
        --tw-prose-pre-code: #e2e8f0;
        --tw-prose-pre-bg: #f8fafc;
        --tw-prose-th-borders: #cbd5e1;
        --tw-prose-td-borders: #e2e8f0;
      }
      .light .prose-invert code:not([data-lang]) {
        background-color: #e2e8f0;
        color: #c026d3;
        padding: 0.125rem 0.25rem;
        border-radius: 0.25rem;
      }
      .light .prose-invert a { color: #2563eb; }
      .light .prose-invert a:hover { color: #1d4ed8; }
      .light .settings-button { background-color: #e2e8f0; color: #334155; }
      .light .settings-button:hover { background-color: #cbd5e1; }
      .light .documentation-list-item[data-selected="false"]:hover { background-color: #f1f5f9; }

      @keyframes spin { to { transform: rotate(360deg); } }
      .animate-spin-slow { animation: spin 3s linear infinite; }

      @media print {
        body, html {
          background: white !important;
          color: black !important;
          height: auto !important;
          overflow: visible !important;
          -webkit-print-color-adjust: exact;
          print-color-adjust: exact;
        }
        @page { margin: 0.75in; size: A4; }
      }
    </style>
  </head>
  <body class="bg-slate-900 text-slate-100 antialiased">
    <div id="root"></div>
    <div id="modal-root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
